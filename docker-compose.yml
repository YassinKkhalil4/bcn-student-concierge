# BCN Student Concierge — single-VPS deployment.
#
#   cp .env.example .env    # then fill it in (see docs/DEPLOY.md)
#   docker compose up -d --build
#
# Topology:
#   internet ──443──▶ caddy ──▶ app ──▶ db
# Only Caddy publishes ports. The app is reachable solely through Caddy, which
# is what makes the client IP it forwards trustworthy for rate limiting, and
# Postgres sits on an internal network with no route to or from the internet.

name: bcnstudent

x-logging: &logging
  driver: json-file
  options:
    # Logs can contain IP addresses (personal data under GDPR): cap retention.
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bcn
      POSTGRES_DB: bcn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcn -d bcn"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bcn:${POSTGRES_PASSWORD}@db:5432/bcn
      # Encrypted document bodies live on this volume (or set S3_BUCKET in .env).
      DATA_DIR: /data
      FORM_TEMPLATE_DIR: /app/templates/forms
      MIGRATE_ON_START: "true"
      MAINTENANCE_ENABLED: "true"
    volumes:
      - documents:/data
      # Official EX-17 / EX-18 PDFs — placed on the server by hand (not redistributable).
      - ./templates/forms:/app/templates/forms:ro
    depends_on:
      db:
        condition: service_healthy
    # backend: Postgres. frontend: Caddy, plus outbound internet for Stripe.
    networks: [backend, frontend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-bcnstudent.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [frontend]
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
  documents:
  caddy_data:
  caddy_config:
