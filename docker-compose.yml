services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - DATABASE_URL=postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/app
    env_file:
      - .env
    volumes:
      - ./data:/data
    networks:
      - bcn_net
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 2.5G

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=app
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bcn_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

networks:
  bcn_net:
    driver: bridge

volumes:
  pgdata:
